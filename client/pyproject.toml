[project]
name = "mr-review"
version = "0.1.0"
description = "CLI для сервиса MR Reviewer: отправляет diff ветки на ревью и сохраняет черновик в .mr-review/"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mr-review = "mr_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mr_review"]
