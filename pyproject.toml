[project]
name = "mr-reviewer"
version = "0.1.0"
description = "AI-ассистент проверки merge request'ов: правила + LLM + человек в контуре"
requires-python = ">=3.11,<3.12"
# зависимости самого агента — только они попадают в Docker-образ
dependencies = [
    "requests==2.34.2",
    "fastapi==0.162.7",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1"]
# скачивание, анализ и очистка данных, ноутбуки
analysis = ["numpy==2.4.6", "pandas==3.1.1", "pyarrow==26.0.1", "matplotlib==3.11.2"]
notebook = ["nbformat==5.11.1", "nbclient==0.11.0", "nbconvert==7.17.2", "ipykernel==7.4.0"]

[tool.uv]
package = false
default-groups = ["dev", "analysis", "notebook"]

[tool.pytest.ini_options]
testpaths = ["agent/tests", "client/tests"]
pythonpath = ["agent", "client/src"]
