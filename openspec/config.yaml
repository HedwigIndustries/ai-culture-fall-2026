schema: spec-driven

context: |
  Language: ru. Артефакты — на русском; заголовки OpenSpec и SHALL/MUST/WHEN/THEN — на английском.

  Проект: MR Reviewer — учебное MVP, AI-ассистент первичного ревью merge request'ов (Python, GitLab).
  Агент = правила + LLM; публикует и мержит только человек. Скоуп: только Python-код.
  Экономика считается в отчёте, кода и спеки у неё нет. Правила работы с кодом — CLAUDE.md в корне.

  Как читать спецификации:
  1. Порядок: этот файл → openspec/context/README.md → proposal.md (зачем) → design.md (как и почему)
     → specs/*/spec.md (что должно быть верно) → tasks.md (что сделать).
  2. Источник истины о поведении — требования SHALL/MUST и сценарии WHEN/THEN. design.md объясняет решения,
     context/ — справка; код подстраивается под спеку, а не наоборот.
  3. Каждый сценарий — проверка: найти тест или скрипт, который его покрывает; если нет — добавить в рамках задачи.
  4. Не додумывать поведение, которого нет в спеке. Неясность или противоречие между спекой, design и кодом —
     остановиться и спросить, а не выбирать молча.
  5. Работать только в рамках задач из tasks.md; найденное вне скоупа — записать как предложение нового изменения.
  6. openspec/specs/ — уже принятое поведение (после archive); openspec/changes/ — то, что ещё в работе.
     Не править specs/ напрямую: только через change и archive.
  7. Держать MVP простым: новые сервисы, зависимости и абстракции — только если их требует спека.

  Справки для реализации — openspec/context/: product, architecture, structure, data, llm, dev-standards,
  testing, security, local-dev, configs, git, glossary.

rules:
  proposal:
    - Держать MVP простым; новые сервисы и зависимости — только с обоснованием.
  design:
    - Для каждого решения — альтернатива и почему отклонена.
    - Сверяться с openspec/context/architecture.md и security.md; при изменении архитектуры обновить их.
  specs:
    - 2–8 требований на capability; каждый сценарий проверяем тестом или воспроизводимым скриптом.
    - Описывать поведение, а не устройство кода.
    - Агент никогда не делает approve/merge; публикация — только после подтверждения человеком.
  tasks:
    - Указывать файлы, которые затрагивает задача.

operations:
  apply:
    guidance:
      - Перед началом прочитать openspec/context/README.md и файлы, относящиеся к изменению.
      - Писать код по openspec/context/dev-standards.md.
      - Ключи только в agent/.env; в коде, тестах и выводе их быть не должно.
      - После каждой группы задач — uv run pytest -q; отметить выполненные задачи в tasks.md.
      - Если меняются структура, конфиги или архитектура — обновить соответствующий файл в openspec/context/.
  archive:
    guidance:
      - Перед archive выполнить чек-лист «Перед archive» из openspec/context/testing.md.
      - Цифры в docs/data/*.md сверить с выводами ноутбуков, в agent/eval/results/*.json — с последним прогоном.
